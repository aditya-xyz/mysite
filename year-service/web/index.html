<!doctype html>
<html lang="en" data-palette="moss">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7f3e8" />
  <script src="/theme.js"></script>
  <title>A private scrapbook</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=paw" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=paw" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=paw" />
  <link rel="preload" href="/fonts/asap-variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/keepsake.css" />
  <link rel="stylesheet" href="/pixelbook.css" />
  <script src="/app.js" type="module"></script>
  <link rel="stylesheet" href="/folded-card.css" /><link rel="stylesheet" href="/loading.css" />
</head>
<body>
  <header><a class="signature" hidden></a><span class="edition-stamp"><button type="button" class="theme-toggle" id="theme-toggle" aria-label="Dark mode" aria-pressed="false" hidden><svg class="theme-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.8 13.2A8.8 8.8 0 0 1 10.8 3a9 9 0 1 0 10 10.2Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/></svg></button></span></header>
  <main id="app" aria-live="polite"><div class="scrapbook-loading" role="status"><svg class="loading-paw" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><ellipse cx="6" cy="12" rx="3.2" ry="4.3" transform="rotate(-24 6 12)"/><ellipse cx="12" cy="6.5" rx="3.1" ry="4.3" transform="rotate(-9 12 6.5)"/><ellipse cx="21" cy="6.5" rx="3.1" ry="4.3" transform="rotate(9 21 6.5)"/><ellipse cx="27" cy="12" rx="3.2" ry="4.3" transform="rotate(24 27 12)"/><path d="M8 21c2-2 3-7 8-7s6 5 8 7c5 7-2 9-5 7-2-1-4-1-6 0-4 2-10 0-5-7Z"/></svg><p>Opening your invitation…</p></div></main>
  <dialog id="photo" tabindex="-1" aria-label="Photo viewer" aria-describedby="photo-caption photo-count"><div class="photo-stage"><div class="photo-image"><img alt="" /><button type="button" class="close photo-control" aria-label="Close photo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg></button><button type="button" id="previous-photo" class="photo-control" aria-label="Previous photo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><button type="button" id="next-photo" class="photo-control" aria-label="Next photo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button><div class="photo-pagination" aria-hidden="true"></div><span id="photo-count" role="status" aria-live="polite" aria-atomic="true"></span></div><div class="photo-toolbar"><div class="photo-actions" role="group" aria-label="Full-resolution photo actions"><button id="full-resolution" class="photo-control resolution-control" type="button" aria-label="Full resolution">Full res</button><button id="save" class="photo-control" aria-label="Save original photo" title="Save photo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" /></svg></button></div></div></div><p class="photo-caption" id="photo-caption"></p><p id="save-status" role="status"></p></dialog>
  <footer hidden></footer>
</body>
</html>
